<!DOCTYPE html>
<!--
  Tech Detector Pro - popup
  Autore: Umberto Meglio - Supporto alla creazione: Claude di Anthropic
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Tech Detector Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" class="logo" alt="">
    <div class="title">
      <h1>Tech Detector Pro</h1>
      <div id="host" class="host"></div>
    </div>
    <button id="btn-export" class="icon-btn" title="Esporta report JSON">⤓</button>
    <button id="btn-copy" class="icon-btn" title="Copia report negli appunti">⧉</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="tech">Tecnologie <span id="cnt-tech" class="pill"></span></button>
    <button class="tab" data-tab="server">Server</button>
    <button class="tab" data-tab="security">Sicurezza <span id="cnt-sec" class="pill"></span></button>
    <button class="tab" data-tab="headers">Header</button>
  </nav>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Analisi in corso…</div>
  </div>

  <main>
    <section id="tab-tech" class="panel active"></section>
    <section id="tab-server" class="panel"></section>
    <section id="tab-security" class="panel"></section>
    <section id="tab-headers" class="panel"></section>
  </main>

  <div class="footer">Tech Detector Pro v<span id="ver"></span> · analisi locale, nessun dato inviato</div>

  <script src="detector.js"></script>
  <script src="pageinfo.js"></script>
  <script src="analyzer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
