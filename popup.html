<!DOCTYPE html>
<!--
  Tech Detector Pro - popup
  Autore: Umberto Meglio - Supporto alla creazione: Claude di Anthropic
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tech Detector Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" class="logo" alt="">
    <div class="title">
      <h1>Tech Detector Pro</h1>
      <div id="host" class="host"></div>
    </div>
    <select id="lang" class="lang" data-i18n-title="ui.language" aria-label="Language"></select>
    <button id="btn-export" class="icon-btn" data-i18n-title="ui.export">⤓</button>
    <button id="btn-copy" class="icon-btn" data-i18n-title="ui.copy">⧉</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="tech"><span data-i18n="ui.tabTech">Technologies</span> <span id="cnt-tech" class="pill"></span></button>
    <button class="tab" data-tab="server"><span data-i18n="ui.tabServer">Server</span></button>
    <button class="tab" data-tab="security"><span data-i18n="ui.tabSecurity">Security</span> <span id="cnt-sec" class="pill"></span></button>
    <button class="tab" data-tab="headers"><span data-i18n="ui.tabHeaders">Headers</span></button>
  </nav>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div data-i18n="ui.loading">Analysing…</div>
  </div>

  <main>
    <section id="tab-tech" class="panel active"></section>
    <section id="tab-server" class="panel"></section>
    <section id="tab-security" class="panel"></section>
    <section id="tab-headers" class="panel"></section>
  </main>

  <div class="footer">Tech Detector Pro v<span id="ver"></span> · <span data-i18n="ui.footer">local analysis, no data sent</span></div>

  <script src="i18n.js"></script>
  <script src="locales/en.js"></script>
  <script src="locales/zh_CN.js"></script>
  <script src="locales/hi.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/ar.js"></script>
  <script src="locales/bn.js"></script>
  <script src="locales/pt_BR.js"></script>
  <script src="locales/ru.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/it.js"></script>
  <script src="detector.js"></script>
  <script src="pageinfo.js"></script>
  <script src="analyzer.js"></script>
  <script src="phpprobe.js"></script>
  <script src="popup.js"></script>
</body>
</html>
